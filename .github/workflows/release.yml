name: validate-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 i 3.9 są w manifeście actions/setup-python tylko do Ubuntu 24.04 (bez 26.04)
          - python: '3.8'
            os: ubuntu-24.04
          - python: '3.9'
            os: ubuntu-24.04
          - python: '3.15'
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate plugin manifests + SKILL.md (Claude + Codex)
        run: python3 tools/validate.py
      - name: Validate changelog for current version
        run: python3 tools/release_notes.py
      - name: Unit tests (offline, all engines)
        run: |
          for t in tools/test_*.py; do python3 "$t"; done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Prepare release notes from changelog
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Build plugin packages (one zip per plugin)
        run: |
          for dir in plugins/*/; do
            name=$(basename "$dir")
            ( cd "$dir" && zip -r "$GITHUB_WORKSPACE/${name}-${GITHUB_REF_NAME}.zip" . -x '**/.DS_Store' )
          done
      - name: Create GitHub Release with the packages
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: "*-${{ github.ref_name }}.zip"
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
